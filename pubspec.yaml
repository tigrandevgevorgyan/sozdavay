name: level_up
description: "Level up project"
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.6+16

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  go_router: ^15.1.1
  provider: ^6.1.5
  flutter_svg: ^2.1.0
  retrofit: 4.8.0
  logger: ^2.4.0  # for logging purpose
  json_annotation: ^4.9.0
  dio: ^5.8.0+1
  get_it: ^8.0.3
  video_player: ^2.9.5
  audioplayers: ^6.4.0
  url_launcher: ^6.3.1
  intl: ^0.20.2
  auto_size_text: ^3.0.0
  flutter_cache_manager: ^3.4.1

  flutter_native_splash: ^2.4.6
  alarm: ^5.1.4
  permission_handler: ^12.0.0+1
  flutter_local_notifications: ^19.2.1

dev_dependencies:
  retrofit_generator: ^9.1.9
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/common/images/
    - assets/brands/level_up/images/
    - assets/brands/w1/images/
    - assets/brands/level_up/config.json
    - assets/brands/w1/config.json
    - assets/sounds/htc_basic.mp3
  fonts:
    - family: Ablation
      fonts:
        - asset: assets/fonts/ablation_black.otf
          weight: 900
        - asset: assets/fonts/ablation_extra_bold.otf
          weight: 800
        - asset: assets/fonts/ablation_bold.otf
          weight: 700

    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 500
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300

flutter_icons:
  android: true
  ios: true
  image_path: "assets/brands/level_up/images/logo_preview.png"
  adaptive_icon_background: "#010101"
  adaptive_icon_foreground:  "assets/brands/level_up/images/logo_android.png"
  remove_alpha_ios: true
